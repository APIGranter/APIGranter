name: Update threat-feed banner

on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate terminal.svg from CISA KEV
        run: python generate.py > terminal.new.svg && mv terminal.new.svg terminal.svg
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal.svg
          git diff --cached --quiet || git commit -m "chore: refresh threat feed banner"
          git push
